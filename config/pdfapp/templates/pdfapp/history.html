<!doctype html>
<html>
  <head>
    <title>PDF History</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2>PDF Processing History</h2>

      <a href="/" class="btn btn-primary mb-3"> Back to Home </a>

      <table class="table table-bordered bg-white">
        <thead>
          <tr>
            <th>Operation</th>
            <th>Date</th>
            <th>Download</th>
          </tr>
        </thead>

        <tbody>
          {% for item in records %}

          <tr>
            <td>{{ item.get_operation_display }}</td>

            <td>{{ item.created_at }}</td>

            <td>
              <a
                href="{{ item.output_file.url }}"
                class="btn btn-success btn-sm"
                download
              >
                Download
              </a>
            </td>
          </tr>

          {% empty %}

          <tr>
            <td colspan="3" class="text-center">No PDF history found.</td>
          </tr>

          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
